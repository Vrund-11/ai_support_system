name: AI Eval Regression Gate

on:
  pull_request:
    paths:
      - 'apps/ai-service/**'
      - 'tests/ai-eval/**'
      - '.github/workflows/ai-eval.yml'
  push:
    branches: [main]
    paths:
      - 'apps/ai-service/**'
      - 'tests/ai-eval/**'
      - '.github/workflows/ai-eval.yml'
  schedule:
    - cron: '0 2 * * *' # Nightly full eval at 02:00 UTC
  workflow_dispatch:

concurrency:
  group: ai-eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-eval-smoke:
    name: AI Service Smoke Evaluation Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Hugging Face Model Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-all-MiniLM-L6-v2-${{ hashFiles('apps/ai-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-all-MiniLM-L6-v2-
            ${{ runner.os }}-huggingface-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run AI Service Unit & Integration Tests
        run: |
          pytest apps/ai-service/tests/test_eval.py apps/ai-service/tests/test_sbert_embeddings.py apps/ai-service/tests/test_retrieval.py -v
        env:
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: sbert

      - name: Run 20-Row Real Model Smoke Evaluation
        run: |
          python tests/ai-eval/run.py --smoke --dataset tests/ai-eval/golden/v2.jsonl --corpus tests/ai-eval/corpus
        env:
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: sbert

  ai-eval-nightly:
    name: Nightly Full Golden Set Evaluation & Regression Gate
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Cache Hugging Face Model Cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-all-MiniLM-L6-v2-${{ hashFiles('apps/ai-service/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-huggingface-all-MiniLM-L6-v2-
            ${{ runner.os }}-huggingface-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ai-service/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Execute Full 115-Sample Golden Evaluation
        run: |
          python tests/ai-eval/run.py --dataset tests/ai-eval/golden/v2.jsonl --corpus tests/ai-eval/corpus --out evidence/ai/eval-nightly.md
        env:
          ENVIRONMENT: test
          LLM_PROVIDER: mock
          EMBEDDING_PROVIDER: sbert

      - name: Upload Evaluation Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ai-eval-nightly-report
          path: evidence/ai/eval-nightly.md
