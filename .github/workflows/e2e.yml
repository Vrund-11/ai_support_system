name: E2E Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e-run:
    name: End-to-End Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run Hermetic E2E Test Suite
        run: pnpm test:e2e
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/supportpilot-e2e
          DATABASE_URL: postgresql://supportpilot:supportpilot@localhost:5432/supportpilot
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: e2e-test-access-secret-at-least-32-chars!!
          JWT_REFRESH_SECRET: e2e-test-refresh-secret-at-least-32-chars!!
          SERVICE_TOKEN: e2e-test-service-token-16
          LLM_PROVIDER: mock

      - name: Run Playwright Tests
        run: npx playwright test --config tests/e2e/playwright.config.ts --project=mocked

      - name: Install Cypress Binary
        run: npx cypress install

      - name: Run Cypress Headless
        run: |
          pnpm --filter @supportpilot/web dev --port 5173 &
          WEB_PID=$!
          for i in {1..30}; do
            if curl -s -f http://localhost:5173 > /dev/null 2>&1; then
              echo "Web dev server ready on port 5173"
              break
            fi
            sleep 1
          done
          xvfb-run --auto-servernum npx cypress run --config-file tests/e2e/cypress.config.ts --browser chrome
          kill $WEB_PID || true

      - name: Build Web Application
        run: pnpm --filter @supportpilot/web build

      - name: Check Bundle Size Limits
        run: npx --yes size-limit

      - name: Run Lighthouse CI Audit
        run: |
          npx --yes @lhci/cli collect --config=lighthouserc.json
          npx --yes @lhci/cli assert --config=lighthouserc.json

      - name: Upload Test Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            test-results/
            playwright-report/
            cypress/videos/
            cypress/screenshots/
            tests/e2e/cypress/videos/
            tests/e2e/cypress/screenshots/
            .lighthouseci/
          retention-days: 7

  # Live Compose Stack E2E suite
  # NOTE: The full multi-service Docker compose stack (6 app containers + 3 datastores + seeding)
  # requires building PyTorch CPU and multi-stage Node images from source, which exceeds standard
  # 2-vCPU / 7GB GitHub-hosted runner memory limits and 20m timeout budgets.
  # It is maintained as a documented local-only / on-demand suite triggered manually via workflow_dispatch.
  live-compose-e2e:
    name: Live Compose Stack & Playwright Live E2E (Manual / Local Suite)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Start Compose Infrastructure & Microservices
        run: |
          docker network create supportpilot-net || true
          docker compose -f infra/docker-compose.infra.yml up -d
          docker compose -f infra/docker-compose.yml up -d --build

      - name: Seed Database
        run: pnpm db:seed

      - name: Run Playwright Live Tests
        run: npx playwright test --config tests/e2e/playwright.config.ts --project=live
