name: Nightly Performance Benchmarks

on:
  schedule:
    - cron: '0 3 * * *' # Nightly at 3:00 AM UTC
  workflow_dispatch:

concurrency:
  group: perf-benchmark
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  k6-benchmark:
    name: k6 Load Testing
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mongo:
        image: mongo:7
        ports: [27017:27017]
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportpilot
          POSTGRES_PASSWORD: supportpilot
          POSTGRES_DB: supportpilot
        ports: [5432:5432]
      redis:
        image: redis:7-alpine
        ports: [6379:6379]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install -r apps/ai-service/requirements.txt

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Build applications
        run: pnpm build

      - name: Start background services
        run: |
          pnpm --filter ticket-service start &
          uvicorn src.main:app --app-dir apps/ai-service --port 8000 &
          sleep 5

      - name: Run k6 Ticket List Benchmark
        run: |
          mkdir -p reports/perf
          k6 run --summary-export=reports/perf/tickets-summary.json tests/perf/tickets.js

      - name: Run k6 Chat WebSocket Benchmark
        run: |
          k6 run --summary-export=reports/perf/chat-summary.json tests/perf/chat.js

      - name: Run k6 AI Endpoint Benchmark
        run: |
          k6 run --summary-export=reports/perf/ai-summary.json tests/perf/ai-service.js

      - name: Upload Performance Reports
        uses: actions/upload-artifact@v7
        with:
          name: k6-performance-summaries
          path: reports/perf/
          retention-days: 30
