# ── SupportPilot Datastores & Supporting Infrastructure ──
# Run: docker compose -f infra/docker-compose.infra.yml up -d

services:
  mongo:
    image: mongo:7
    container_name: sp-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    networks:
      - supportpilot-net
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: pgvector/pgvector:pg16
    container_name: sp-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
      - '5433:5432'
    environment:
      POSTGRES_USER: supportpilot
      POSTGRES_PASSWORD: supportpilot
      POSTGRES_DB: supportpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - supportpilot-net
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supportpilot']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - supportpilot-net
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

