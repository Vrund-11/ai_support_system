# ── SupportPilot Docker Compose ──
# Datastores + supporting services for local development.
# Start: docker compose up -d
# Stop:  docker compose down

services:
  # ── MongoDB ──
  mongo:
    image: mongo:9
    container_name: sp-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── PostgreSQL + pgvector ──
  postgres:
    image: pgvector/pgvector:pg16
    container_name: sp-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: supportpilot
      POSTGRES_PASSWORD: supportpilot
      POSTGRES_DB: supportpilot
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U supportpilot']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──
  redis:
    image: redis:7-alpine
    container_name: sp-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO (S3-compatible) ──
  minio:
    image: minio/minio:latest
    container_name: sp-minio
    restart: unless-stopped
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO bucket init ──
  minio-init:
    image: minio/mc:latest
    container_name: sp-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb local/supportpilot-files --ignore-existing &&
        echo 'Bucket ready'
      "
    restart: 'no'

  # ── MailHog (SMTP + web UI) ──
  mailhog:
    image: mailhog/mailhog:latest
    container_name: sp-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8025']
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Ticket Service (Core Business API) ──
  ticket-service:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/ticket-service/Dockerfile
    container_name: sp-ticket-service
    restart: unless-stopped
    ports:
      - '4001:4001'
    environment:
      NODE_ENV: production
      PORT: '4001'
      MONGODB_URI: mongodb://mongo:27017/supportpilot
      REDIS_URL: redis://redis:6379
      SERVICE_TOKEN: default-service-token
      JWT_ACCESS_SECRET: test-access-secret-must-be-32-chars!!
      JWT_REFRESH_SECRET: test-refresh-secret-must-be-32-chars!
      NOTIFICATION_SERVICE_URL: http://notification-service:5001
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── AI Service (FastAPI RAG, Classifier, Assist) ──
  ai-service:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/ai-service/Dockerfile
    container_name: sp-ai-service
    restart: unless-stopped
    ports:
      - '8000:8000'
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://supportpilot:supportpilot@postgres:5432/supportpilot
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: mock
      SERVICE_TOKEN: default-service-token
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Notification Service (BullMQ queues, email, webhooks) ──
  notification-service:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/notification-service/Dockerfile
    container_name: sp-notification-service
    restart: unless-stopped
    ports:
      - '5001:5001'
    environment:
      NODE_ENV: production
      PORT: '5001'
      REDIS_URL: redis://redis:6379
      SERVICE_TOKEN: default-service-token
      SMTP_HOST: mailhog
      SMTP_PORT: '1025'
    depends_on:
      redis:
        condition: service_healthy
      mailhog:
        condition: service_healthy

  # ── Gateway (API Gateway, Rate Limiting, GraphQL, Socket.IO) ──
  gateway:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/gateway/Dockerfile
    container_name: sp-gateway
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: production
      PORT: '4000'
      REDIS_URL: redis://redis:6379
      TICKET_SERVICE_URL: http://ticket-service:4001
      AI_SERVICE_URL: http://ai-service:8000
      NOTIFICATION_SERVICE_URL: http://notification-service:5001
      SERVICE_TOKEN: default-service-token
      JWT_ACCESS_SECRET: test-access-secret-must-be-32-chars!!
    depends_on:
      ticket-service:
        condition: service_started
      ai-service:
        condition: service_started
      redis:
        condition: service_healthy

  # ── Web Dashboard (React SPA + Nginx) ──
  web:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    container_name: sp-web
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - gateway

  # ── Chat Widget Host ──
  widget:
    profiles: ['full']
    build:
      context: ../..
      dockerfile: apps/widget/Dockerfile
    container_name: sp-widget
    restart: unless-stopped
    ports:
      - '3001:80'
    depends_on:
      - gateway

volumes:
  mongo-data:
  postgres-data:
  redis-data:
  minio-data:
