apiVersion: v1
kind: ConfigMap
metadata:
  name: supportpilot-config
  namespace: supportpilot
data:
  NODE_ENV: 'production'
  MONGODB_URI: 'mongodb://mongo.supportpilot.svc.cluster.local:27017/supportpilot'
  DATABASE_URL: 'postgresql://supportpilot:supportpilot@postgres.supportpilot.svc.cluster.local:5432/supportpilot'
  REDIS_URL: 'redis://redis.supportpilot.svc.cluster.local:6379'
  TICKET_SERVICE_URL: 'http://ticket-service.supportpilot.svc.cluster.local:4001'
  AI_SERVICE_URL: 'http://ai-service.supportpilot.svc.cluster.local:8000'
  NOTIFICATION_SERVICE_URL: 'http://notification-service.supportpilot.svc.cluster.local:5001'
  SMTP_HOST: 'mailhog.supportpilot.svc.cluster.local'
  SMTP_PORT: '1025'
  LLM_PROVIDER: 'mock'
  EMBEDDING_PROVIDER: 'sbert'
  EMBEDDING_MODEL: 'sentence-transformers/all-MiniLM-L6-v2'
  EMBEDDING_DIM: '384'
