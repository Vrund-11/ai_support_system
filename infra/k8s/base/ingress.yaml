apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: supportpilot-ingress
  namespace: supportpilot
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-read-timeout: '3600'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '3600'
    nginx.ingress.kubernetes.io/websocket-services: 'gateway'
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          # API, GraphQL, and Socket.IO -> gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 4000
          - path: /graphql
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 4000
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 4000
          # Frontend SPA -> web
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
