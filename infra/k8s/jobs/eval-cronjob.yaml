apiVersion: batch/v1
kind: CronJob
metadata:
  name: supportpilot-ai-eval
  namespace: supportpilot
spec:
  schedule: '0 2 * * *' # Nightly at 2:00 AM UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: supportpilot-ai-eval
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
          containers:
            - name: eval-runner
              image: supportpilot/ai-service:latest
              imagePullPolicy: IfNotPresent
              command:
                - python
                - -m
                - pytest
                - apps/ai-service/tests/test_eval.py
                - -v
              envFrom:
                - configMapRef:
                    name: supportpilot-config
                - secretRef:
                    name: supportpilot-secrets
              resources:
                requests:
                  cpu: 250m
                  memory: 256Mi
                limits:
                  cpu: 1000m
                  memory: 1024Mi
