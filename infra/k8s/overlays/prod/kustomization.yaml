apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: supportpilot

bases:
  - ../../base

images:
  - name: supportpilot/gateway
    newTag: v1.0.0
  - name: supportpilot/ticket-service
    newTag: v1.0.0
  - name: supportpilot/ai-service
    newTag: v1.0.0
  - name: supportpilot/notification-service
    newTag: v1.0.0
  - name: supportpilot/web
    newTag: v1.0.0

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: gateway
      spec:
        replicas: 3
    target:
      kind: Deployment
      name: gateway
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: ticket-service
      spec:
        replicas: 2
    target:
      kind: Deployment
      name: ticket-service
