global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'supportpilot-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:4000', 'host.docker.internal:4000']
        labels:
          service: 'gateway'

  - job_name: 'supportpilot-ticket-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ticket-service:4001', 'host.docker.internal:4001']
        labels:
          service: 'ticket-service'

  - job_name: 'supportpilot-ai-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['ai-service:8000', 'host.docker.internal:8000']
        labels:
          service: 'ai-service'

  - job_name: 'supportpilot-notification-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['notification-service:5001', 'host.docker.internal:5001']
        labels:
          service: 'notification-service'
